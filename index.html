<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALZ Foundations — Hierarchy Designer</title>
<style>
  :root {
    --azure-blue: #0078d4;
    --azure-blue-dark: #005a9e;
    --border: #2c2c2c;
    --border-soft: #c0c0c0;
    --canvas-bg: #fafafa;
    --grid-dot: #dadada;
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #555;
    --danger: #c41e3a;
    --pill-bg: #fff7d6;
    --pill-border: #b58400;
    --pill-text: #5b4500;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 14px;
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 2px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 16px 0 0;
    letter-spacing: -0.01em;
  }
  .toolbar h1 .dot { color: var(--azure-blue); }
  .btn {
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 6px 14px;
    font: inherit;
    border-radius: 5px;
    cursor: pointer;
    transition: background .1s, transform .05s;
  }
  .btn:hover { background: #f0f0f0; }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--azure-blue);
    color: #fff;
    border-color: var(--azure-blue);
  }
  .btn.primary:hover { background: var(--azure-blue-dark); border-color: var(--azure-blue-dark); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { background: #fde7e9; }
  .btn.ghost { border-color: var(--border-soft); }
  .spacer { flex: 1; }
  .kbd {
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 11px;
    border: 1px solid var(--border-soft);
    border-radius: 3px;
    padding: 1px 5px;
    background: #f5f5f5;
    color: var(--muted);
  }
  .dropdown { position: relative; display: inline-block; }
  .dropdown-menu {
    position: absolute;
    right: 0;
    top: 100%;
    margin-top: 2px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 5px;
    min-width: 200px;
    z-index: 100;
    display: none;
    overflow: hidden;
  }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    padding: 8px 14px;
    font: inherit;
    cursor: pointer;
  }
  .dropdown-menu button:hover { background: #eef6fc; }

  /* Main area: only canvas; pool/minimap floating */
  .main {
    position: relative;
    overflow: hidden;
  }
  .canvas-wrap {
    width: 100%;
    height: 100%;
    overflow: auto;
    position: relative;
    background:
      radial-gradient(circle, var(--grid-dot) 1px, transparent 1.2px) 0 0/24px 24px,
      var(--canvas-bg);
  }
  .canvas {
    position: relative;
    min-width: 100%;
    min-height: 100%;
    padding: 32px;
  }
  #connectors {
    position: absolute;
    left: 0; top: 0;
    pointer-events: none;
    overflow: visible;
    z-index: 2;
  }

  /* Cards */
  .node {
    position: absolute;
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
    user-select: none;
    font-size: 13px;
    z-index: 3;
    cursor: grab;
    outline: 2px solid transparent;
    outline-offset: 2px;
    transition: outline-color .1s;
  }
  .node:active { cursor: grabbing; }
  .node.root {
    cursor: default;
    border-style: dashed;
    background: #fafafa;
    text-align: center;
    font-weight: 600;
  }
  .node.selected { outline-color: var(--azure-blue); }
  .node.drag-over-ok { outline-color: var(--azure-blue); outline-style: dashed; }
  .node.drag-over-bad { outline-color: var(--danger); outline-style: dashed; cursor: not-allowed; }
  .node .name {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }
  .node .glyph { color: var(--muted); flex-shrink: 0; }
  .node .archetype-tag {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
    background: #f0f0f0;
    border: 1px solid var(--border-soft);
    border-radius: 3px;
    padding: 1px 5px;
    text-transform: lowercase;
  }
  .node .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border-soft);
  }
  .sub-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--pill-bg);
    border: 1.5px solid var(--pill-border);
    color: var(--pill-text);
    border-radius: 12px;
    padding: 2px 9px;
    font-size: 11px;
    cursor: grab;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub-pill:active { cursor: grabbing; }
  .sub-pill.selected {
    outline: 2px solid var(--azure-blue);
    outline-offset: 1px;
  }
  .sub-pill .glyph { color: var(--pill-text); flex-shrink: 0; }

  /* Bottom slide-up tray (replaces side pool) */
  .tray {
    position: fixed;
    left: 50%;
    transform: translateX(-50%) translateY(calc(100% - 36px));
    bottom: 0;
    width: min(640px, 92vw);
    background: #fff;
    border: 2px solid var(--border);
    border-bottom: 0;
    border-radius: 10px 10px 0 0;
    z-index: 150;
    transition: transform .25s ease;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -6px 18px rgba(0,0,0,.06);
  }
  .tray:hover, .tray.open { transform: translateX(-50%) translateY(0); }
  .tray-handle {
    padding: 8px 16px;
    font-weight: 600;
    font-size: 13px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .tray-handle .count {
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    color: var(--pill-text);
    border-radius: 10px;
    padding: 0 7px;
    font-size: 11px;
  }
  .tray-handle .grip {
    width: 28px;
    height: 4px;
    background: var(--border-soft);
    border-radius: 2px;
    margin-right: auto;
  }
  .tray-body {
    padding: 12px 14px;
    max-height: 220px;
    overflow: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 60px;
  }
  .tray-body.drag-over-ok { background: #eef6fc; }
  .tray-empty { color: var(--muted); font-size: 12px; padding: 8px; width: 100%; text-align: center; }
  .tray-actions {
    padding: 10px 14px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    gap: 6px;
  }
  .tray-actions input {
    flex: 1;
    padding: 6px 10px;
    border: 1.5px solid var(--border-soft);
    border-radius: 5px;
    font: inherit;
  }

  /* Floating mini-map */
  .minimap {
    position: fixed;
    right: 16px;
    top: 80px;
    width: 220px;
    height: 150px;
    background: rgba(255, 255, 255, 0.94);
    border: 2px solid var(--border);
    border-radius: 6px;
    z-index: 140;
    overflow: hidden;
    cursor: pointer;
  }
  .minimap.collapsed { width: 36px; height: 36px; }
  .minimap.collapsed svg { display: none; }
  .minimap-label {
    position: absolute;
    top: 4px;
    left: 6px;
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
    background: rgba(255,255,255,.7);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .minimap-vp {
    fill: rgba(0, 120, 212, 0.12);
    stroke: var(--azure-blue);
    stroke-width: 1.5;
  }

  /* Command palette */
  .cmd-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    z-index: 500;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 16vh;
  }
  .cmd-overlay.open { display: flex; }
  .cmd-palette {
    width: min(560px, 90vw);
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.2);
  }
  .cmd-palette input {
    border: 0;
    border-bottom: 1px solid var(--border-soft);
    padding: 14px 16px;
    font: inherit;
    font-size: 15px;
    outline: none;
  }
  .cmd-list {
    max-height: 320px;
    overflow: auto;
    padding: 4px;
  }
  .cmd-item {
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .cmd-item:hover, .cmd-item.active { background: #eef6fc; }
  .cmd-item .kind {
    color: var(--muted);
    font-size: 11px;
    margin-left: auto;
    background: #f0f0f0;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .cmd-empty { padding: 16px; color: var(--muted); text-align: center; font-size: 13px; }

  /* Side panel */
  .side-panel {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 340px;
    background: #fff;
    border-left: 2px solid var(--border);
    transform: translateX(100%);
    transition: transform .2s;
    z-index: 200;
    display: flex;
    flex-direction: column;
  }
  .side-panel.open { transform: translateX(0); }
  .side-panel header {
    padding: 14px 16px;
    border-bottom: 1.5px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .side-panel header h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .side-panel .body { padding: 16px; flex: 1; overflow: auto; }
  .side-panel .body label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .side-panel .body input,
  .side-panel .body select {
    width: 100%;
    padding: 7px 10px;
    border: 1.5px solid var(--border-soft);
    border-radius: 5px;
    font: inherit;
    margin-bottom: 12px;
  }
  .side-panel footer {
    padding: 12px 16px;
    border-top: 1.5px solid var(--border);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .close-x {
    background: transparent;
    border: 0;
    cursor: pointer;
    font-size: 18px;
    color: var(--muted);
  }

  /* Modal (export/import) */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 8px;
    width: min(800px, 90vw);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  .modal header {
    padding: 14px 18px;
    border-bottom: 1.5px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal header h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .modal pre {
    margin: 0;
    padding: 14px 18px;
    flex: 1;
    overflow: auto;
    background: #fafafa;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 12px;
    white-space: pre;
  }
  .modal textarea {
    margin: 0;
    padding: 14px 18px;
    flex: 1;
    overflow: auto;
    background: #fafafa;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 12px;
    border: 0;
    resize: none;
    outline: none;
  }
  .modal footer {
    padding: 12px 18px;
    border-top: 1.5px solid var(--border);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 24px;
    background: #1a1a1a;
    color: #fff;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .2s;
    z-index: 400;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
    text-align: center;
    pointer-events: none;
  }
  .empty-hint .big { font-size: 18px; font-weight: 600; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>ALZ Foundations<span class="dot">.</span></h1>
  <button class="btn primary" id="btn-load-ref">Load reference architecture</button>
  <button class="btn ghost" id="btn-cmd" title="Command palette (Ctrl/Cmd+K)">⌘K</button>
  <button class="btn ghost" id="btn-undo" title="Ctrl/Cmd+Z">Undo</button>
  <div class="spacer"></div>
  <label style="display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;">
    Library
    <select id="alz-tag-select" style="padding:5px 6px;border:1.5px solid var(--border-soft);border-radius:5px;font:inherit;min-width:200px;">
      <option value="">Loading…</option>
    </select>
    <button class="btn ghost" id="btn-refresh-tags" title="Refresh from GitHub" style="padding:4px 8px;">↻</button>
  </label>
  <div class="dropdown" id="export-dd">
    <button class="btn primary" id="btn-export">Export ▾</button>
    <div class="dropdown-menu">
      <button data-export="svg">SVG diagram</button>
      <button data-export="png">PNG diagram</button>
      <button data-export="json">JSON model</button>
      <button data-export="bicep">Bicep</button>
      <button data-export="terraform">Terraform</button>
      <button data-export="mermaid">Mermaid + outline</button>
      <button data-export="alz-arch">ALZ architecture definition</button>
    </div>
  </div>
  <button class="btn ghost" id="btn-import">Import JSON</button>
  <button class="btn danger" id="btn-clear">Clear</button>
</div>

<div class="main">
  <div class="canvas-wrap" id="canvas-wrap">
    <div class="canvas" id="canvas">
      <svg id="connectors">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c2c2c"/>
          </marker>
        </defs>
      </svg>
    </div>
    <div class="empty-hint" id="empty-hint">
      <div class="big">Empty hierarchy</div>
      <div>Click <b>Load reference architecture</b>, hit <span class="kbd">⌘K</span>, or use the toolbar.</div>
    </div>
  </div>

  <!-- Mini-map -->
  <div class="minimap" id="minimap" title="Click to toggle">
    <div class="minimap-label">overview</div>
    <svg id="minimap-svg"></svg>
  </div>

  <!-- Bottom slide-up tray for unplaced subscriptions -->
  <aside class="tray" id="tray">
    <div class="tray-handle" id="tray-handle">
      <div class="grip"></div>
      <span>Unplaced subscriptions</span>
      <span class="count" id="tray-count">0</span>
    </div>
    <div class="tray-body" id="tray-body"></div>
    <div class="tray-actions">
      <input id="new-sub-name" placeholder="New subscription name…" />
      <button class="btn" id="btn-add-sub-pool">+ Add</button>
    </div>
  </aside>
</div>

<aside class="side-panel" id="side-panel">
  <header>
    <h2 id="sp-title">Edit node</h2>
    <button class="close-x" id="sp-close">×</button>
  </header>
  <div class="body">
    <label>Display name</label>
    <input id="sp-name" />
    <label>ID (slug, used in IaC)</label>
    <input id="sp-id" />
    <div id="sp-sub-fields">
      <label>Azure Subscription ID (optional UUID)</label>
      <input id="sp-subid" placeholder="00000000-0000-0000-0000-000000000000" />
    </div>
    <div id="sp-mg-fields">
      <label>Archetype <span id="sp-archetype-status" style="font-weight:400;color:var(--muted);"></span></label>
      <select id="sp-archetype">
        <option value="">(none)</option>
      </select>
      <input id="sp-archetype-fallback" placeholder="Type archetype manually (offline fallback)…" style="display:none;" />
      <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-top:4px;">
        <input type="checkbox" id="sp-exists" style="width:auto;margin:0;" />
        <span>Already exists in Azure (<code>exists: true</code>)</span>
      </label>
    </div>
  </div>
  <footer>
    <button class="btn danger" id="sp-delete">Delete</button>
    <div class="spacer"></div>
    <button class="btn" id="sp-cancel">Cancel</button>
    <button class="btn primary" id="sp-save">Save</button>
  </footer>
</aside>

<!-- Command palette -->
<div class="cmd-overlay" id="cmd-overlay">
  <div class="cmd-palette">
    <input id="cmd-input" placeholder="Type a command or search nodes…" />
    <div class="cmd-list" id="cmd-list"></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal">
    <header>
      <h2 id="modal-title">Export</h2>
      <button class="close-x" id="modal-close">×</button>
    </header>
    <pre id="modal-content"></pre>
    <textarea id="modal-textarea" style="display:none"></textarea>
    <footer>
      <button class="btn" id="modal-copy">Copy</button>
      <button class="btn primary" id="modal-download">Download</button>
      <button class="btn" id="modal-browse" style="display:none">Browse…</button>
      <input type="file" id="modal-file-input" accept=".json,application/json" style="display:none" />
      <button class="btn primary" id="modal-import-confirm" style="display:none">Import</button>
    </footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
'use strict';

// =====================================================================
// State
// =====================================================================

const STORAGE_KEY = 'alz-foundations:state';
const TYPE = { ROOT: 'root', MG: 'mg', SUB: 'subscription' };

function makeId(prefix) {
  return prefix + '-' + Math.random().toString(36).slice(2, 8);
}
function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'node';
}
function makeRoot() {
  return { id: 'tenant-root', type: TYPE.ROOT, name: 'Tenant root group', children: [] };
}

let state = {
  root: makeRoot(),
  pool: [],
  meta: { orgName: 'Contoso' },
};
let undoStack = [];
let selectedId = null;

// =====================================================================
// Tree helpers
// =====================================================================

function findNode(root, id, path = []) {
  if (root.id === id) return { node: root, parent: null, path };
  for (const child of (root.children || [])) {
    const r = findNode(child, id, [...path, root]);
    if (r) {
      if (r.parent === null) r.parent = root;
      return r;
    }
  }
  return null;
}
function isDescendant(ancestor, candidateId) {
  if (ancestor.id === candidateId) return true;
  return (ancestor.children || []).some(c => isDescendant(c, candidateId));
}
function allIds(root, out = new Set()) {
  out.add(root.id);
  for (const c of (root.children || [])) allIds(c, out);
  return out;
}
function uniqueId(root, base) {
  const ids = allIds(root);
  let id = base;
  let n = 2;
  while (ids.has(id)) { id = base + '-' + n; n++; }
  return id;
}

// =====================================================================
// Mutations
// =====================================================================

function snapshot() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 50) undoStack.shift();
}
function undo() {
  const prev = undoStack.pop();
  if (!prev) { toast('Nothing to undo'); return; }
  state = JSON.parse(prev);
  selectedId = null;
  render();
  save();
}
function addMg(parentId, name) {
  const parent = findNode(state.root, parentId);
  if (!parent || parent.node.type === TYPE.SUB) return;
  snapshot();
  const id = uniqueId(state.root, 'mg-' + slugify(name));
  parent.node.children.push({ id, type: TYPE.MG, name, archetypes: [], exists: false, children: [] });
  save(); render();
}
function addSubToPool(name) {
  snapshot();
  state.pool.push({ id: makeId('sub'), type: TYPE.SUB, name, subscriptionId: null, children: [] });
  save(); render();
}
function placeSubscription(subId, targetMgId) {
  const idx = state.pool.findIndex(s => s.id === subId);
  if (idx < 0) return;
  const target = findNode(state.root, targetMgId);
  if (!target || target.node.type === TYPE.SUB) return;
  snapshot();
  const [sub] = state.pool.splice(idx, 1);
  target.node.children.push(sub);
  save(); render();
}
function moveNode(nodeId, targetMgId) {
  if (nodeId === targetMgId) return;
  const found = findNode(state.root, nodeId);
  if (!found || !found.parent) return;
  if (isDescendant(found.node, targetMgId)) return;
  const target = findNode(state.root, targetMgId);
  if (!target || target.node.type === TYPE.SUB) return;
  snapshot();
  const arr = found.parent.children;
  const idx = arr.findIndex(c => c.id === nodeId);
  arr.splice(idx, 1);
  target.node.children.push(found.node);
  save(); render();
}
function unplaceSubscription(subId) {
  const found = findNode(state.root, subId);
  if (!found || found.node.type !== TYPE.SUB || !found.parent) return;
  snapshot();
  const arr = found.parent.children;
  arr.splice(arr.findIndex(c => c.id === subId), 1);
  state.pool.push(found.node);
  save(); render();
}
function deleteNode(id) {
  if (id === state.root.id) return;
  const found = findNode(state.root, id);
  if (found) {
    snapshot();
    const arr = found.parent.children;
    arr.splice(arr.findIndex(c => c.id === id), 1);
    save(); render();
    return;
  }
  const idx = state.pool.findIndex(s => s.id === id);
  if (idx >= 0) {
    snapshot();
    state.pool.splice(idx, 1);
    save(); render();
  }
}
function updateNode(id, patch) {
  const found = findNode(state.root, id);
  let node = found?.node;
  if (!node) node = state.pool.find(s => s.id === id);
  if (!node) return;
  snapshot();
  Object.assign(node, patch);
  save(); render();
}

// =====================================================================
// Persistence
// =====================================================================

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }, 200);
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (!parsed.root) return false;
    state = parsed;
    if (!state.pool) state.pool = [];
    if (!state.meta) state.meta = { orgName: 'Contoso' };
    return true;
  } catch { return false; }
}

// =====================================================================
// Reference architecture
// =====================================================================

function loadReferenceArchitecture() {
  if (state.root.children.length || state.pool.length) {
    if (!confirm('This will replace the current hierarchy. Continue?')) return;
  }
  snapshot();
  const mg = (id, name, archetypes, children = []) => ({
    id, type: TYPE.MG, name, archetypes: archetypes || [], exists: false, children,
  });
  const sub = (name) => ({ id: makeId('sub'), type: TYPE.SUB, name, subscriptionId: null, children: [] });
  const org = mg('Contoso', state.meta.orgName || 'Contoso', ['root'], [
    mg('Platform', 'Platform', ['platform'], [
      mg('Security', 'Security', [], [sub('Security subscription')]),
      mg('Management', 'Management', ['management'], [sub('Management subscription')]),
      mg('Identity', 'Identity', ['identity'], [sub('Identity subscription')]),
      mg('Connectivity', 'Connectivity', ['connectivity_override'], [sub('Connectivity subscription')]),
    ]),
    mg('LandingZones', 'Landing zones', ['landing_zones_override'], [
      mg('Corp', 'Corp', ['corp'], [
        sub('Landing zone A1 subscription'),
        sub('Landing zone P1 subscription'),
        sub('Landing zone A2 subscription'),
      ]),
      mg('Online', 'Online', ['online']),
      mg('Local', 'Local', ['corp'], [
        sub('Landing zone LC1 subscription (Azure Local Clusters)'),
        sub('Landing zone LA1 subscription (Applications)'),
      ]),
    ]),
    mg('Decommissioned', 'Decommissioned', ['decommissioned'], [sub('Decommissioned subscription')]),
    mg('Sandbox', 'Sandbox', ['sandbox'], [
      sub('Sandbox subscription 1'),
      sub('Sandbox subscription 2'),
    ]),
  ]);
  state.root = makeRoot();
  state.root.children.push(org);
  state.pool = [];
  save(); render();
}

// =====================================================================
// Layout — tidy-tree but only MG nodes participate; subs render as pills
// =====================================================================

const NODE_W = 200;
const NODE_BASE_H = 44;
const PILL_AREA_PER_ROW = 22;
const PILL_AREA_PADDING = 14;
const H_GAP = 24;
const V_GAP = 60;
const PAD = 32;

function pillRowsFor(node) {
  const subs = (node.children || []).filter(c => c.type === TYPE.SUB);
  if (!subs.length) return 0;
  // Rough estimate: pills wrap at ~2 per row given pill widths
  return Math.ceil(subs.length / 2);
}

function nodeHeight(node) {
  if (node.type === TYPE.SUB) return 0; // not laid out
  const rows = pillRowsFor(node);
  return NODE_BASE_H + (rows ? PILL_AREA_PADDING + rows * PILL_AREA_PER_ROW : 0);
}

function mgChildren(node) {
  return (node.children || []).filter(c => c.type !== TYPE.SUB);
}

function layout(root) {
  // Pass 1: subtree widths (only MG children matter)
  function first(node) {
    const kids = mgChildren(node);
    if (!kids.length) {
      node._w = NODE_W;
      return;
    }
    let total = 0;
    kids.forEach(first);
    kids.forEach((k, i) => {
      total += k._w;
      if (i > 0) total += H_GAP;
    });
    node._w = Math.max(NODE_W, total);
  }
  // Pass 2: absolute placement
  function place(node, x, y) {
    node._x = x;
    node._y = y;
    node._h = nodeHeight(node);
    const kids = mgChildren(node);
    if (!kids.length) {
      node._x = x + (node._w - NODE_W) / 2;
      return;
    }
    let total = 0;
    kids.forEach((k, i) => {
      total += k._w;
      if (i > 0) total += H_GAP;
    });
    let cursor = x + (node._w - total) / 2;
    for (const k of kids) {
      place(k, cursor, y + node._h + V_GAP);
      cursor += k._w + H_GAP;
    }
    const firstKid = kids[0], lastKid = kids[kids.length - 1];
    const mid = (firstKid._x + lastKid._x + NODE_W) / 2;
    node._x = mid - NODE_W / 2;
  }
  first(root);
  place(root, 0, 0);

  // Bbox
  let maxX = 0, maxY = 0;
  function visit(n) {
    if (n.type === TYPE.SUB) return;
    maxX = Math.max(maxX, n._x + NODE_W);
    maxY = Math.max(maxY, n._y + n._h);
    mgChildren(n).forEach(visit);
  }
  visit(root);
  return { width: maxX, height: maxY };
}

// =====================================================================
// Render
// =====================================================================

const els = {
  canvas: document.getElementById('canvas'),
  canvasWrap: document.getElementById('canvas-wrap'),
  connectors: document.getElementById('connectors'),
  trayBody: document.getElementById('tray-body'),
  trayCount: document.getElementById('tray-count'),
  emptyHint: document.getElementById('empty-hint'),
  minimapSvg: document.getElementById('minimap-svg'),
  minimap: document.getElementById('minimap'),
};

function render() {
  // Clear cards (keep <svg id=connectors>)
  for (const child of [...els.canvas.children]) {
    if (child.id !== 'connectors') child.remove();
  }
  // Clear connector paths but keep <defs>
  for (const child of [...els.connectors.children]) {
    if (child.tagName !== 'defs') child.remove();
  }

  const hasContent = state.root.children.length > 0;
  els.emptyHint.style.display = hasContent ? 'none' : 'flex';

  if (hasContent) {
    const { width, height } = layout(state.root);
    els.canvas.style.width = (width + PAD * 2) + 'px';
    els.canvas.style.height = (height + PAD * 2) + 'px';
    els.connectors.setAttribute('width', width + PAD * 2);
    els.connectors.setAttribute('height', height + PAD * 2);

    drawConnectors(state.root);
    renderNode(state.root);
  } else {
    els.canvas.style.width = '100%';
    els.canvas.style.height = '100%';
  }

  // Tray
  els.trayBody.innerHTML = '';
  els.trayCount.textContent = state.pool.length;
  if (!state.pool.length) {
    const empty = document.createElement('div');
    empty.className = 'tray-empty';
    empty.textContent = 'No unplaced subscriptions. Drop subscription pills here to un-place.';
    els.trayBody.appendChild(empty);
  } else {
    for (const sub of state.pool) {
      const pill = createPill(sub, 'pool-sub');
      els.trayBody.appendChild(pill);
    }
  }

  renderMinimap();
}

function createPill(sub, kind) {
  const pill = document.createElement('div');
  pill.className = 'sub-pill';
  if (sub.id === selectedId) pill.classList.add('selected');
  pill.draggable = true;
  pill.dataset.id = sub.id;
  pill.dataset.kind = kind;
  pill.title = sub.name;
  pill.innerHTML = subGlyph() + escapeHtml(sub.name);
  pill.addEventListener('dragstart', onDragStart);
  pill.addEventListener('dragend', onDragEnd);
  pill.addEventListener('click', (e) => {
    e.stopPropagation();
    openSidePanel(sub.id);
  });
  return pill;
}

function renderNode(node) {
  if (node.type === TYPE.SUB) return;

  const el = document.createElement('div');
  el.className = 'node ' + (node.type === TYPE.ROOT ? 'root' : 'mg');
  if (node.id === selectedId) el.classList.add('selected');
  el.style.left = (node._x + PAD) + 'px';
  el.style.top = (node._y + PAD) + 'px';
  el.style.width = NODE_W + 'px';
  el.dataset.id = node.id;
  el.dataset.kind = node.type === TYPE.ROOT ? 'root' : 'mg';
  el.draggable = node.type !== TYPE.ROOT;

  const archetype = (node.archetypes && node.archetypes[0]) || '';
  const archeTag = archetype ? `<span class="archetype-tag">${escapeHtml(archetype)}</span>` : '';
  const glyph = node.type === TYPE.ROOT ? '' : mgGlyph();
  const nameRow = `<div class="name">${glyph}<span>${escapeHtml(node.name)}</span>${archeTag}</div>`;

  const subs = (node.children || []).filter(c => c.type === TYPE.SUB);
  let pillsHtml = '';
  if (subs.length) {
    pillsHtml = '<div class="pills" data-pill-host="1"></div>';
  }
  el.innerHTML = nameRow + pillsHtml;

  el.addEventListener('click', (e) => {
    e.stopPropagation();
    if (node.type !== TYPE.ROOT) openSidePanel(node.id);
  });
  el.addEventListener('dragstart', onDragStart);
  el.addEventListener('dragend', onDragEnd);
  if (node.type !== TYPE.SUB) {
    el.addEventListener('dragover', onDragOverMg);
    el.addEventListener('dragleave', onDragLeave);
    el.addEventListener('drop', onDropMg);
  }
  els.canvas.appendChild(el);

  // Append pills inside the .pills container
  if (subs.length) {
    const host = el.querySelector('[data-pill-host]');
    for (const s of subs) host.appendChild(createPill(s, 'tree-sub'));
  }

  // Recurse into MG children only
  for (const c of mgChildren(node)) renderNode(c);
}

function drawConnectors(node) {
  const NS = 'http://www.w3.org/2000/svg';
  for (const c of mgChildren(node)) {
    const x1 = node._x + NODE_W / 2 + PAD;
    const y1 = node._y + node._h + PAD;
    const x2 = c._x + NODE_W / 2 + PAD;
    const y2 = c._y + PAD;
    const ym = y1 + (y2 - y1) / 2;
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', `M ${x1} ${y1} L ${x1} ${ym} L ${x2} ${ym} L ${x2} ${y2}`);
    path.setAttribute('stroke', '#2c2c2c');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('fill', 'none');
    path.setAttribute('marker-end', 'url(#arrow)');
    els.connectors.appendChild(path);
    drawConnectors(c);
  }
}

function mgGlyph() {
  return `<svg class="glyph" width="14" height="14" viewBox="0 0 16 16" fill="none">
    <rect x="2" y="3" width="12" height="10" rx="1" stroke="currentColor" stroke-width="1.4"/>
    <line x1="2" y1="6" x2="14" y2="6" stroke="currentColor" stroke-width="1.4"/>
  </svg>`;
}
function subGlyph() {
  return `<svg class="glyph" width="11" height="11" viewBox="0 0 16 16" fill="none">
    <circle cx="5" cy="8" r="2.5" stroke="currentColor" stroke-width="1.4"/>
    <path d="M7.5 8 L14 8 L14 10 L12.5 10 L12.5 11.5 L11 11.5 L11 10 L9 10" stroke="currentColor" stroke-width="1.4" fill="none"/>
  </svg>`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// =====================================================================
// Mini-map
// =====================================================================

function renderMinimap() {
  const svg = els.minimapSvg;
  svg.innerHTML = '';
  if (!state.root.children.length) {
    els.minimap.style.display = 'none';
    return;
  }
  els.minimap.style.display = '';
  const W = 220, H = 150;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);

  const { width, height } = layout(state.root);
  const totalW = width + PAD * 2;
  const totalH = height + PAD * 2;
  const sx = W / totalW;
  const sy = H / totalH;
  const s = Math.min(sx, sy);
  const NS = 'http://www.w3.org/2000/svg';

  function visit(n) {
    if (n.type === TYPE.SUB) return;
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', (n._x + PAD) * s);
    r.setAttribute('y', (n._y + PAD) * s);
    r.setAttribute('width', NODE_W * s);
    r.setAttribute('height', n._h * s);
    r.setAttribute('fill', n.id === selectedId ? '#0078d4' : '#fff');
    r.setAttribute('stroke', '#2c2c2c');
    r.setAttribute('stroke-width', '0.5');
    r.setAttribute('rx', '1');
    svg.appendChild(r);
    mgChildren(n).forEach(visit);
  }
  visit(state.root);

  // Viewport rectangle
  const wrap = els.canvasWrap;
  const vp = document.createElementNS(NS, 'rect');
  vp.setAttribute('class', 'minimap-vp');
  vp.setAttribute('x', wrap.scrollLeft * s);
  vp.setAttribute('y', wrap.scrollTop * s);
  vp.setAttribute('width', Math.min(wrap.clientWidth, totalW) * s);
  vp.setAttribute('height', Math.min(wrap.clientHeight, totalH) * s);
  svg.appendChild(vp);
}

els.canvasWrap.addEventListener('scroll', () => renderMinimap(), { passive: true });
els.minimap.addEventListener('click', () => els.minimap.classList.toggle('collapsed'));

// =====================================================================
// Drag & drop
// =====================================================================

let dragInfo = null;

function onDragStart(e) {
  const el = e.currentTarget;
  dragInfo = { id: el.dataset.id, kind: el.dataset.kind };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', el.dataset.id);
  e.stopPropagation();
}
function onDragEnd() {
  dragInfo = null;
  document.querySelectorAll('.drag-over-ok, .drag-over-bad').forEach(el => {
    el.classList.remove('drag-over-ok', 'drag-over-bad');
  });
}
function onDragOverMg(e) {
  if (!dragInfo) return;
  const targetEl = e.currentTarget;
  const targetId = targetEl.dataset.id;
  let ok = false;
  if (dragInfo.kind === 'pool-sub' || dragInfo.kind === 'tree-sub') ok = true;
  else if (dragInfo.kind === 'mg') {
    const found = findNode(state.root, dragInfo.id);
    ok = !!found && !isDescendant(found.node, targetId) && dragInfo.id !== targetId;
  }
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = ok ? 'move' : 'none';
  targetEl.classList.toggle('drag-over-ok', ok);
  targetEl.classList.toggle('drag-over-bad', !ok);
}
function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over-ok', 'drag-over-bad');
}
function onDropMg(e) {
  e.preventDefault();
  e.stopPropagation();
  const targetEl = e.currentTarget;
  targetEl.classList.remove('drag-over-ok', 'drag-over-bad');
  if (!dragInfo) return;
  const targetId = targetEl.dataset.id;
  if (dragInfo.kind === 'pool-sub') placeSubscription(dragInfo.id, targetId);
  else if (dragInfo.kind === 'tree-sub' || dragInfo.kind === 'mg') moveNode(dragInfo.id, targetId);
}

// Tray as drop target — un-place subscription
els.trayBody.addEventListener('dragover', (e) => {
  if (!dragInfo || dragInfo.kind !== 'tree-sub') return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  els.trayBody.classList.add('drag-over-ok');
});
els.trayBody.addEventListener('dragleave', () => els.trayBody.classList.remove('drag-over-ok'));
els.trayBody.addEventListener('drop', (e) => {
  e.preventDefault();
  els.trayBody.classList.remove('drag-over-ok');
  if (!dragInfo || dragInfo.kind !== 'tree-sub') return;
  unplaceSubscription(dragInfo.id);
});

// Tray handle: click to toggle pinned
document.getElementById('tray-handle').addEventListener('click', () => {
  document.getElementById('tray').classList.toggle('open');
});

// =====================================================================
// Side panel
// =====================================================================

const sp = {
  panel: document.getElementById('side-panel'),
  title: document.getElementById('sp-title'),
  name: document.getElementById('sp-name'),
  id: document.getElementById('sp-id'),
  subFields: document.getElementById('sp-sub-fields'),
  subId: document.getElementById('sp-subid'),
  mgFields: document.getElementById('sp-mg-fields'),
  archetype: document.getElementById('sp-archetype'),
  archetypeStatus: document.getElementById('sp-archetype-status'),
  archetypeFallback: document.getElementById('sp-archetype-fallback'),
  exists: document.getElementById('sp-exists'),
  current: null,
};
document.getElementById('sp-close').onclick = closeSidePanel;
document.getElementById('sp-cancel').onclick = closeSidePanel;
document.getElementById('sp-save').onclick = () => {
  if (!sp.current) return;
  const newName = sp.name.value.trim();
  const newId = sp.id.value.trim() || sp.current.id;
  const patch = { name: newName || sp.current.name };
  if (newId !== sp.current.id) {
    const ids = allIds(state.root);
    state.pool.forEach(s => ids.add(s.id));
    if (ids.has(newId)) { toast('ID already in use'); return; }
    patch.id = newId;
  }
  if (sp.current.type === TYPE.SUB) {
    patch.subscriptionId = sp.subId.value.trim() || null;
  } else if (sp.current.type === TYPE.MG) {
    let arche = sp.archetype.value;
    if (sp.archetypeFallback.style.display !== 'none' && sp.archetypeFallback.value.trim()) {
      arche = sp.archetypeFallback.value.trim();
    }
    patch.archetypes = arche ? [arche] : [];
    patch.exists = sp.exists.checked;
  }
  updateNode(sp.current.id, patch);
  closeSidePanel();
};
document.getElementById('sp-delete').onclick = () => {
  if (!sp.current) return;
  if (sp.current.id === state.root.id) return;
  if (!confirm(`Delete "${sp.current.name}" and all its children?`)) return;
  deleteNode(sp.current.id);
  closeSidePanel();
};

function openSidePanel(id) {
  let node = findNode(state.root, id)?.node;
  if (!node) node = state.pool.find(s => s.id === id);
  if (!node) return;
  sp.current = node;
  selectedId = id;
  sp.title.textContent = node.type === TYPE.SUB ? 'Edit subscription' : 'Edit management group';
  sp.name.value = node.name;
  sp.id.value = node.id;
  sp.subFields.style.display = node.type === TYPE.SUB ? '' : 'none';
  sp.mgFields.style.display = node.type === TYPE.MG ? '' : 'none';
  sp.subId.value = node.subscriptionId || '';
  sp.exists.checked = !!node.exists;
  populateArchetypeSelect(node.archetypes && node.archetypes[0]);
  sp.panel.classList.add('open');
  render();
}
function closeSidePanel() {
  sp.panel.classList.remove('open');
  sp.current = null;
  render();
}

// =====================================================================
// ALZ Library tag + archetype fetch
// =====================================================================

const LIB_REPO = 'Azure/Azure-Landing-Zones-Library';
const TAG_PREFIX = 'platform/alz/';
const TAGS_CACHE_KEY = 'alz-foundations:tags';
const TAGS_TTL_MS = 24 * 3600 * 1000;
const ARCH_CACHE_PREFIX = 'alz-foundations:archetypes:';

const tagSelectEl = document.getElementById('alz-tag-select');
const refreshTagsBtn = document.getElementById('btn-refresh-tags');

let cachedTags = null;
let archetypesByTag = {};

function readJsonLS(key) {
  try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; }
}
function writeJsonLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
async function ghJson(url) {
  const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
  if (res.status === 403 || res.status === 429) {
    throw new Error('GitHub rate-limited (60/hr unauth). Try later or refresh.');
  }
  if (!res.ok) throw new Error(`GitHub ${res.status} ${res.statusText}`);
  return await res.json();
}
async function fetchTags(force = false) {
  if (!force) {
    const cached = readJsonLS(TAGS_CACHE_KEY);
    if (cached && cached.fetchedAt && (Date.now() - cached.fetchedAt) < TAGS_TTL_MS) {
      cachedTags = cached.tags;
      return cached.tags;
    }
  }
  const all = [];
  for (let page = 1; page <= 3; page++) {
    const url = `https://api.github.com/repos/${LIB_REPO}/tags?per_page=100&page=${page}`;
    const arr = await ghJson(url);
    all.push(...arr.map(t => t.name));
    if (arr.length < 100) break;
  }
  const filtered = all
    .filter(n => n.startsWith(TAG_PREFIX))
    .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
  cachedTags = filtered;
  writeJsonLS(TAGS_CACHE_KEY, { fetchedAt: Date.now(), tags: filtered });
  return filtered;
}
async function fetchArchetypes(tag, force = false) {
  if (!force) {
    const cached = readJsonLS(ARCH_CACHE_PREFIX + tag);
    if (cached) { archetypesByTag[tag] = cached; return cached; }
  }
  const url = `https://api.github.com/repos/${LIB_REPO}/contents/platform/alz/archetype_definitions?ref=${encodeURIComponent(tag)}`;
  const arr = await ghJson(url);
  const names = arr
    .filter(e => e.type === 'file' && e.name.endsWith('.alz_archetype_definition.json'))
    .map(e => e.name.replace(/\.alz_archetype_definition\.json$/, ''))
    .sort();
  archetypesByTag[tag] = names;
  writeJsonLS(ARCH_CACHE_PREFIX + tag, names);
  return names;
}
async function loadTagsIntoSelect(force = false) {
  tagSelectEl.innerHTML = '<option value="">Loading…</option>';
  tagSelectEl.disabled = true;
  try {
    const tags = await fetchTags(force);
    tagSelectEl.innerHTML = '<option value="">— Select library version —</option>';
    for (const t of tags) {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t.replace(/^platform\//, '');
      tagSelectEl.appendChild(opt);
    }
    tagSelectEl.disabled = false;
    if (state.meta.alzTag && tags.includes(state.meta.alzTag)) {
      tagSelectEl.value = state.meta.alzTag;
      try { await fetchArchetypes(state.meta.alzTag); } catch {}
    }
  } catch (e) {
    tagSelectEl.innerHTML = '<option value="">(failed)</option>';
    tagSelectEl.disabled = false;
    toast('Tag fetch failed: ' + e.message);
  }
}
async function populateArchetypeSelect(currentValue) {
  const tag = state.meta.alzTag;
  const sel = sp.archetype;
  sel.innerHTML = '<option value="">(none)</option>';
  sp.archetypeFallback.style.display = 'none';
  sp.archetypeFallback.value = '';
  if (!tag) {
    sp.archetypeStatus.textContent = '— pick a library version in the toolbar first';
    sel.disabled = true;
    if (currentValue) {
      sp.archetypeFallback.style.display = '';
      sp.archetypeFallback.value = currentValue;
    }
    return;
  }
  sel.disabled = true;
  sp.archetypeStatus.textContent = '— loading…';
  let names = archetypesByTag[tag] || readJsonLS(ARCH_CACHE_PREFIX + tag);
  if (!names) {
    try { names = await fetchArchetypes(tag); }
    catch (e) {
      sp.archetypeStatus.textContent = `— fetch failed (${e.message})`;
      sp.archetypeFallback.style.display = '';
      sp.archetypeFallback.value = currentValue || '';
      sel.disabled = false;
      return;
    }
  }
  archetypesByTag[tag] = names;
  for (const n of names) {
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = n;
    sel.appendChild(opt);
  }
  sel.disabled = false;
  sp.archetypeStatus.textContent = `— ${names.length} from ${tag.replace(/^platform\//, '')}`;
  if (currentValue) {
    if (names.includes(currentValue)) {
      sel.value = currentValue;
    } else {
      sp.archetypeFallback.style.display = '';
      sp.archetypeFallback.value = currentValue;
    }
  }
}

// Clipboard
let clipboard = null;
function deepCloneWithNewIds(node) {
  return {
    ...node,
    id: makeId(node.type === TYPE.SUB ? 'sub' : 'mg'),
    children: (node.children || []).map(deepCloneWithNewIds),
  };
}
function getSelectedNode() {
  if (!selectedId) return null;
  const inTree = findNode(state.root, selectedId)?.node;
  if (inTree) return inTree;
  return state.pool.find(s => s.id === selectedId) || null;
}

// Keyboard
document.addEventListener('keydown', (e) => {
  const t = document.activeElement?.tagName;
  const inField = t === 'INPUT' || t === 'TEXTAREA' || document.activeElement?.isContentEditable;

  // Ctrl/Cmd+K — command palette (works even in fields, but lets palette input handle next)
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openCommandPalette();
    return;
  }

  if (inField) return;

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    undo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
    const sel = getSelectedNode();
    if (!sel || sel.type === TYPE.ROOT) return;
    clipboard = JSON.parse(JSON.stringify(sel));
    toast(`Copied "${clipboard.name}"`);
    e.preventDefault();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
    if (!clipboard) { toast('Clipboard empty'); return; }
    const sel = getSelectedNode();
    if (!sel) { toast('Select a target MG first'); return; }
    if (sel.type === TYPE.SUB) { toast('Subscriptions can\'t hold children — pick an MG'); return; }
    if (state.pool.includes(sel)) { toast('Pool items can\'t be parents — pick a tree node'); return; }
    snapshot();
    const clone = deepCloneWithNewIds(clipboard);
    sel.children.push(clone);
    save(); render();
    toast(`Pasted "${clone.name}"`);
    e.preventDefault();
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const sel = getSelectedNode();
    if (!sel || sel.type === TYPE.ROOT) return;
    e.preventDefault();
    const name = sel.name;
    deleteNode(sel.id);
    selectedId = null;
    closeSidePanel();
    toast(`Deleted "${name}" (Ctrl+Z to undo)`);
    return;
  }
  if (e.key === 'Escape') {
    closeSidePanel();
    closeModal();
    closeCommandPalette();
    selectedId = null;
    render();
  }
});

const cmdOverlay = document.getElementById('cmd-overlay');
const cmdInput = document.getElementById('cmd-input');
const cmdList = document.getElementById('cmd-list');
let cmdActiveIdx = 0;
let cmdResults = [];

function commandList() {

    { id: 'cmd:load-ref', label: 'Load reference architecture', kind: 'action', run: loadReferenceArchitecture },
    { id: 'cmd:new-mg', label: 'New management group…', kind: 'action', run: () => {

        ? selectedId

    }},
    { id: 'cmd:new-sub', label: 'New subscription (to pool)…', kind: 'action', run: () => {
      const name = prompt('Subscription name:', 'New subscription');
      if (!name) return;
      addSubToPool(name.trim());
    }},
    { id: 'cmd:undo', label: 'Undo', kind: 'action', run: undo },
    { id: 'cmd:clear', label: 'Clear hierarchy', kind: 'action', run: () => document.getElementById('btn-clear').click() },
    { id: 'cmd:export-svg', label: 'Export → SVG', kind: 'action', run: () => runExport('svg') },
    { id: 'cmd:export-png', label: 'Export → PNG', kind: 'action', run: () => runExport('png') },
    { id: 'cmd:export-json', label: 'Export → JSON', kind: 'action', run: () => runExport('json') },
    { id: 'cmd:export-bicep', label: 'Export → Bicep', kind: 'action', run: () => runExport('bicep') },
    { id: 'cmd:export-tf', label: 'Export → Terraform', kind: 'action', run: () => runExport('terraform') },
    { id: 'cmd:export-mermaid', label: 'Export → Mermaid', kind: 'action', run: () => runExport('mermaid') },
    { id: 'cmd:export-alz', label: 'Export → ALZ architecture definition', kind: 'action', run: () => runExport('alz-arch') },
    { id: 'cmd:import', label: 'Import JSON…', kind: 'action', run: openImportDialog },
  ];
  // Plus tree nodes (jump-to-select)
  const nodes = [];
  function visit(n) {
    if (n.type !== TYPE.ROOT) {
      nodes.push({
        id: 'node:' + n.id,
        label: n.name,
        kind: n.type === TYPE.SUB ? 'sub' : 'mg',
        run: () => {
          selectedId = n.id;
          openSidePanel(n.id);
        },
      });
    }
    for (const c of (n.children || [])) visit(c);
  }
  visit(state.root);
  state.pool.forEach(s => nodes.push({
    id: 'node:' + s.id,
    label: s.name + ' (pool)',
    kind: 'sub',
    run: () => openSidePanel(s.id),
  }));
  return [...cmds, ...nodes];
}

function fuzzyMatch(query, text) {
  if (!query) return 0;
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  if (t.includes(q)) return 100 - (t.indexOf(q));
  // simple subseq score
  let qi = 0;
  for (let i = 0; i < t.length && qi < q.length; i++) {
    if (t[i] === q[qi]) qi++;
  }
  return qi === q.length ? 1 : -1;
}

function renderCmdList() {
  const q = cmdInput.value.trim();
  const all = commandList();
  cmdResults = q
    ? all.map(c => ({ c, s: fuzzyMatch(q, c.label) }))
        .filter(x => x.s > 0)
        .sort((a, b) => b.s - a.s)
        .map(x => x.c)
    : all;
  cmdList.innerHTML = '';
  if (!cmdResults.length) {
    cmdList.innerHTML = '<div class="cmd-empty">No matches</div>';
    return;
  }
  cmdActiveIdx = Math.min(cmdActiveIdx, cmdResults.length - 1);
  cmdResults.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'cmd-item' + (i === cmdActiveIdx ? ' active' : '');
    el.innerHTML = `<span>${escapeHtml(c.label)}</span><span class="kind">${c.kind}</span>`;
    el.addEventListener('click', () => runCmd(c));
    cmdList.appendChild(el);
  });
}

function runCmd(c) {
  closeCommandPalette();
  setTimeout(() => c.run(), 0);
}

function openCommandPalette() {
  cmdActiveIdx = 0;
  cmdInput.value = '';
  renderCmdList();
  cmdOverlay.classList.add('open');
  setTimeout(() => cmdInput.focus(), 0);
}
function closeCommandPalette() {
  cmdOverlay.classList.remove('open');
}
cmdOverlay.addEventListener('click', (e) => {
  if (e.target === cmdOverlay) closeCommandPalette();
});
cmdInput.addEventListener('input', () => { cmdActiveIdx = 0; renderCmdList(); });
cmdInput.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    cmdActiveIdx = Math.min(cmdActiveIdx + 1, cmdResults.length - 1);
    renderCmdList();
    e.preventDefault();
  } else if (e.key === 'ArrowUp') {
    cmdActiveIdx = Math.max(cmdActiveIdx - 1, 0);
    renderCmdList();
    e.preventDefault();
  } else if (e.key === 'Enter') {
    if (cmdResults[cmdActiveIdx]) runCmd(cmdResults[cmdActiveIdx]);
    e.preventDefault();
  } else if (e.key === 'Escape') {
    closeCommandPalette();
    e.preventDefault();
  }
});

function runExport(kind) {
  switch (kind) {
    case 'svg': return exportSvg();
    case 'png': return exportPng();
    case 'json': return openModal('JSON model', JSON.stringify(serializeState(), null, 2), 'alz-foundations.json');
    case 'bicep': return openModal('Bicep', toBicep(), 'alz-foundations.bicep');
    case 'terraform': return openModal('Terraform', toTerraform(), 'alz-foundations.tf');
    case 'mermaid': return openModal('Mermaid + outline', toMermaidAndOutline(), 'alz-foundations.md');
    case 'alz-arch': return exportAlzArch();
  }
}

function exportAlzArch() {
  const defaultName = state.meta.archName || (state.meta.orgName || 'alz').toLowerCase().replace(/[^a-z0-9]/g, '');
  const name = prompt('Architecture name (used for "name" field, no spaces):', defaultName);
  if (name === null) return;
  state.meta.archName = name.trim() || defaultName;
  save();
  let placedSubs = 0;
  (function count(n) {
    if (n.type === TYPE.SUB) placedSubs++;
    (n.children || []).forEach(count);
  })(state.root);
  if (placedSubs + state.pool.length > 0) {
    toast(`${placedSubs + state.pool.length} subscription(s) omitted — format does not include them`);
  }
  const out = toAlzArchDef(state.meta.archName);
  openModal('ALZ architecture definition', JSON.stringify(out, null, 2), `${state.meta.archName}.alz_architecture_definition.json`);
}

function toAlzArchDef(archName) {
  const groups = [];
  function visit(node, parentId) {
    if (node.type === TYPE.MG) {
      groups.push({
        archetypes: node.archetypes && node.archetypes.length ? [...node.archetypes] : [],
        display_name: node.name,
        exists: !!node.exists,
        id: node.id,
        parent_id: parentId,
      });
      for (const c of (node.children || [])) visit(c, node.id);
    } else if (node.type === TYPE.ROOT) {
      for (const c of (node.children || [])) visit(c, null);
    }
  }
  visit(state.root, null);
  return {
    $schema: 'https://raw.githubusercontent.com/Azure/Azure-Landing-Zones-Library/main/schemas/architecture_definition.json',
    name: archName,
    management_groups: groups,
  };
}

function serializeState() {
  function clean(n) {
    const { _x, _y, _w, _h, ...rest } = n;
    return { ...rest, children: (n.children || []).map(clean) };
  }
  return {
    orgName: state.meta.orgName,
    root: clean(state.root),
    pool: state.pool.map(clean),
  };
}

function buildSvg() {
  if (!state.root.children.length) {
    return `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80"><text x="10" y="40" font-family="Inter,Segoe UI" font-size="14">Empty hierarchy</text></svg>`;
  }
  const { width, height } = layout(state.root);
  const W = width + PAD * 2;
  const H = height + PAD * 2;
  const NS = 'http://www.w3.org/2000/svg';
  const parts = [];
  parts.push(`<svg xmlns="${NS}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13">`);
  parts.push(`<defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1" fill="#dadada"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c2c2c"/>
    </marker>
  </defs>`);
  parts.push(`<rect width="100%" height="100%" fill="#fafafa"/>`);
  parts.push(`<rect width="100%" height="100%" fill="url(#dots)"/>`);

  // Connectors
  function drawSvgConnectors(node) {
    for (const c of mgChildren(node)) {
      const x1 = node._x + NODE_W / 2 + PAD;
      const y1 = node._y + node._h + PAD;
      const x2 = c._x + NODE_W / 2 + PAD;
      const y2 = c._y + PAD;
      const ym = y1 + (y2 - y1) / 2;
      parts.push(`<path d="M ${x1} ${y1} L ${x1} ${ym} L ${x2} ${ym} L ${x2} ${y2}" stroke="#2c2c2c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>`);
      drawSvgConnectors(c);
    }
  }
  drawSvgConnectors(state.root);

  // MG cards with pills
  function drawSvgNode(n) {
    if (n.type === TYPE.SUB) return;
    const x = n._x + PAD, y = n._y + PAD;
    const isRoot = n.type === TYPE.ROOT;
    parts.push(`<g>`);
    parts.push(`<rect x="${x}" y="${y}" width="${NODE_W}" height="${n._h}" fill="${isRoot ? '#fafafa' : '#ffffff'}" stroke="#2c2c2c" stroke-width="2" rx="7" ${isRoot ? 'stroke-dasharray="6 4"' : ''}/>`);
    const label = escapeXml(n.name);
    const lines = wrapLabel(label, 22);
    const startY = y + 14;
    lines.forEach((line, i) => {
      const tx = isRoot ? x + NODE_W / 2 : x + 12;
      const anchor = isRoot ? 'middle' : 'start';
      parts.push(`<text x="${tx}" y="${startY + i * 14}" text-anchor="${anchor}" font-weight="500">${line}</text>`);
    });
    // Archetype tag
    const arche = (n.archetypes && n.archetypes[0]) || '';
    if (arche && !isRoot) {
      const tagW = Math.min(arche.length * 6 + 12, 80);
      parts.push(`<rect x="${x + NODE_W - tagW - 8}" y="${y + 8}" width="${tagW}" height="16" fill="#f0f0f0" stroke="#c0c0c0" rx="3"/>`);
      parts.push(`<text x="${x + NODE_W - tagW / 2 - 8}" y="${y + 19}" text-anchor="middle" font-size="10" fill="#555">${escapeXml(arche)}</text>`);
    }
    // Pills
    const subs = (n.children || []).filter(c => c.type === TYPE.SUB);
    if (subs.length) {
      const pillsTop = y + NODE_BASE_H + 6;
      let cx = x + 10;
      let cy = pillsTop;
      subs.forEach((s) => {
        const labelText = s.name.length > 22 ? s.name.slice(0, 20) + '…' : s.name;
        const w = Math.min(labelText.length * 6 + 16, NODE_W - 20);
        if (cx + w > x + NODE_W - 10) {
          cx = x + 10;
          cy += 20;
        }
        parts.push(`<rect x="${cx}" y="${cy}" width="${w}" height="16" fill="#fff7d6" stroke="#b58400" rx="8"/>`);
        parts.push(`<text x="${cx + w / 2}" y="${cy + 11}" text-anchor="middle" font-size="10" fill="#5b4500">${escapeXml(labelText)}</text>`);
        cx += w + 4;
      });
    }
    parts.push(`</g>`);
    mgChildren(n).forEach(drawSvgNode);
  }
  drawSvgNode(state.root);

  parts.push(`</svg>`);
  return parts.join('\n');
}
function escapeXml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
}
function wrapLabel(s, n) {
  if (s.length <= n) return [s];
  const words = s.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).trim().length > n && cur) { lines.push(cur); cur = w; }
    else cur = (cur + ' ' + w).trim();
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 2);
}
function exportSvg() {
  const svg = buildSvg();
  openModal('SVG diagram', svg, 'alz-foundations.svg');
}
function exportPng() {
  const svg = buildSvg();
  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const scale = 2;
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((png) => {
      URL.revokeObjectURL(url);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(png);
      a.download = 'alz-foundations.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 0);
      toast('PNG downloaded');
    }, 'image/png');
  };
  img.onerror = () => { toast('PNG export failed'); URL.revokeObjectURL(url); };
  img.src = url;
}

function toBicep() {
  const lines = [];
  lines.push(`// ALZ Foundations — generated Bicep`);
  lines.push(`targetScope = 'tenant'`);
  lines.push('');
  function bicepIdent(id) { return id.replace(/[^a-zA-Z0-9_]/g, '_'); }
  const mgs = [];
  function collectMgs(n, parentId) {
    if (n.type === TYPE.MG) {
      mgs.push({ id: n.id, name: n.name, parentId });
      for (const c of n.children || []) collectMgs(c, n.id);
    } else if (n.type === TYPE.ROOT) {
      for (const c of n.children || []) collectMgs(c, null);
    }
  }
  collectMgs(state.root, null);
  for (const mg of mgs) {
    const ident = bicepIdent(mg.id);
    lines.push(`resource ${ident} 'Microsoft.Management/managementGroups@2021-04-01' = {`);
    lines.push(`  name: '${mg.id}'`);
    lines.push(`  scope: tenant()`);
    lines.push(`  properties: {`);
    lines.push(`    displayName: '${mg.name.replace(/'/g, "\\'")}'`);
    if (mg.parentId) {
      lines.push(`    details: {`);
      lines.push(`      parent: {`);
      lines.push(`        id: ${bicepIdent(mg.parentId)}.id`);
      lines.push(`      }`);
      lines.push(`    }`);
    }
    lines.push(`  }`);
    lines.push(`}`);
    lines.push('');
  }
  const subAssoc = [];
  function collectSubs(n, parentId) {
    for (const c of (n.children || [])) {
      if (c.type === TYPE.SUB) subAssoc.push({ sub: c, parentId });
      else collectSubs(c, c.id);
    }
  }
  collectSubs(state.root, null);
  if (subAssoc.length) {
    lines.push(`// Subscription placements — note: subscriptions must already exist; Bicep cannot create them.`);
    for (const { sub, parentId } of subAssoc) {
      const ident = bicepIdent(sub.id);
      const subId = sub.subscriptionId || `00000000-0000-0000-0000-000000000000`;
      const placeholder = sub.subscriptionId ? '' : ' // TODO: replace with real subscription GUID';
      lines.push(`resource ${ident} 'Microsoft.Management/managementGroups/subscriptions@2020-05-01' = {`);
      lines.push(`  parent: ${bicepIdent(parentId)}`);
      lines.push(`  name: '${subId}'${placeholder}`);
      lines.push(`}`);
      lines.push('');
    }
  }
  if (state.pool.length) {
    lines.push(`/* Unplaced subscriptions (not emitted):`);
    for (const s of state.pool) lines.push(`  - ${s.name}${s.subscriptionId ? ' (' + s.subscriptionId + ')' : ''}`);
    lines.push(`*/`);
  }
  return lines.join('\n');
}

function toTerraform() {
  const lines = [];
  lines.push(`# ALZ Foundations — generated Terraform`);
  lines.push('');
  lines.push(`terraform {`);
  lines.push(`  required_providers {`);
  lines.push(`    azurerm = { source = "hashicorp/azurerm", version = "~> 3.0" }`);
  lines.push(`  }`);
  lines.push(`}`);
  lines.push(`provider "azurerm" { features {} }`);
  lines.push('');
  function tfIdent(id) { return id.replace(/[^a-zA-Z0-9_]/g, '_'); }
  const mgs = [];
  function collectMgs(n, parentId) {
    if (n.type === TYPE.MG) {
      mgs.push({ id: n.id, name: n.name, parentId });
      for (const c of n.children || []) collectMgs(c, n.id);
    } else if (n.type === TYPE.ROOT) {
      for (const c of n.children || []) collectMgs(c, null);
    }
  }
  collectMgs(state.root, null);
  for (const mg of mgs) {
    const ident = tfIdent(mg.id);
    lines.push(`resource "azurerm_management_group" "${ident}" {`);
    lines.push(`  name         = "${mg.id}"`);
    lines.push(`  display_name = "${mg.name.replace(/"/g, '\\"')}"`);
    if (mg.parentId) {
      lines.push(`  parent_management_group_id = azurerm_management_group.${tfIdent(mg.parentId)}.id`);
    }
    lines.push(`}`);
    lines.push('');
  }
  const subAssoc = [];
  function collectSubs(n) {
    for (const c of (n.children || [])) {
      if (c.type === TYPE.SUB) subAssoc.push({ sub: c, parentId: n.id });
      else collectSubs(c);
    }
  }
  collectSubs(state.root);
  if (subAssoc.length) {
    lines.push(`# Subscription placements — subscriptions must already exist.`);
    for (const { sub, parentId } of subAssoc) {
      const ident = tfIdent(sub.id);
      const subId = sub.subscriptionId || `00000000-0000-0000-0000-000000000000`;
      const placeholder = sub.subscriptionId ? '' : ' # TODO: replace with real subscription GUID';
      lines.push(`resource "azurerm_management_group_subscription_association" "${ident}" {`);
      lines.push(`  management_group_id = azurerm_management_group.${tfIdent(parentId)}.id`);
      lines.push(`  subscription_id     = "/subscriptions/${subId}"${placeholder}`);
      lines.push(`}`);
      lines.push('');
    }
  }
  if (state.pool.length) {
    lines.push(`# Unplaced subscriptions (not emitted):`);
    for (const s of state.pool) lines.push(`#   - ${s.name}${s.subscriptionId ? ' (' + s.subscriptionId + ')' : ''}`);
  }
  return lines.join('\n');
}

function toMermaidAndOutline() {
  const m = ['```mermaid', 'graph TD'];
  function mid(s) { return s.replace(/[^a-zA-Z0-9_]/g, '_'); }
  function visit(n, parent) {
    const id = mid(n.id);
    const label = n.name.replace(/"/g, "'");
    if (n.type === TYPE.SUB) m.push(`  ${id}[/"${label}"/]`);
    else m.push(`  ${id}["${label}"]`);
    if (parent) m.push(`  ${mid(parent.id)} --> ${id}`);
    for (const c of (n.children || [])) visit(c, n);
  }
  visit(state.root, null);
  m.push('```');
  const o = ['', '## Outline', ''];
  function outline(n, depth) {
    const prefix = '  '.repeat(depth) + (depth === 0 ? '' : '- ');
    const tag = n.type === TYPE.SUB ? ' (sub)' : '';
    o.push(prefix + n.name + tag);
    for (const c of (n.children || [])) outline(c, depth + 1);
  }
  outline(state.root, 0);
  if (state.pool.length) {
    o.push('', '## Unplaced subscriptions', '');
    for (const s of state.pool) o.push('- ' + s.name);
  }
  return m.join('\n') + '\n' + o.join('\n');
}

// =====================================================================
// Modal (export + import)
// =====================================================================

const modal = {
  backdrop: document.getElementById('modal-backdrop'),
  title: document.getElementById('modal-title'),
  content: document.getElementById('modal-content'),
  textarea: document.getElementById('modal-textarea'),
  copy: document.getElementById('modal-copy'),
  download: document.getElementById('modal-download'),
  importBtn: document.getElementById('modal-import-confirm'),
  filename: 'export.txt',
  mime: 'text/plain',
};
document.getElementById('modal-close').onclick = closeModal;
modal.backdrop.addEventListener('click', (e) => {
  if (e.target === modal.backdrop) closeModal();
});
modal.copy.onclick = () => {
  const text = modal.textarea.style.display !== 'none' ? modal.textarea.value : modal.content.textContent;
  navigator.clipboard.writeText(text).then(() => toast('Copied'));
};
modal.download.onclick = () => {
  const text = modal.textarea.style.display !== 'none' ? modal.textarea.value : modal.content.textContent;
  const blob = new Blob([text], { type: modal.mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = modal.filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 0);
  toast('Downloaded');
};

function openModal(title, content, filename) {
  modal.title.textContent = title;
  modal.content.textContent = content;
  modal.content.style.display = '';
  modal.textarea.style.display = 'none';
  modal.copy.style.display = '';
  modal.download.style.display = '';
  modal.importBtn.style.display = 'none';
  if (modal.browse) modal.browse.style.display = 'none';
  modal.filename = filename || 'export.txt';
  if (filename?.endsWith('.svg')) modal.mime = 'image/svg+xml';
  else if (filename?.endsWith('.json')) modal.mime = 'application/json';
  else modal.mime = 'text/plain';
  modal.backdrop.classList.add('open');
}
function closeModal() {
  modal.backdrop.classList.remove('open');
}
function openImportDialog() {
  modal.title.textContent = 'Import JSON';
  modal.content.style.display = 'none';
  modal.textarea.style.display = '';
  modal.textarea.value = '';
  modal.textarea.placeholder = 'Paste JSON, click Browse…, or drop a .json file here.\nAuto-detects:\n  • Native JSON model (root + pool)\n  • ALZ architecture definition (management_groups[])';
  modal.copy.style.display = 'none';
  modal.download.style.display = 'none';
  modal.browse.style.display = '';
  modal.importBtn.style.display = '';
  modal.backdrop.classList.add('open');
}
const browseBtn = document.getElementById('modal-browse');
const fileInput = document.getElementById('modal-file-input');
modal.browse = browseBtn;
browseBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const f = fileInput.files[0];
  if (!f) return;
  try {
    modal.textarea.value = await f.text();
    toast(`Loaded ${f.name}`);
  } catch (e) {
    toast('Read failed: ' + e.message);
  }
  fileInput.value = '';
});
modal.importBtn.onclick = () => {
  try {
    const parsed = JSON.parse(modal.textarea.value);
    snapshot();
    if (Array.isArray(parsed.management_groups)) {
      state = importAlzArchDef(parsed);
      toast(`Imported ALZ architecture "${parsed.name || 'unnamed'}"`);
    } else if (parsed.root) {
      state = {
        root: parsed.root,
        pool: parsed.pool || [],
        meta: { orgName: parsed.orgName || 'Contoso', archName: parsed.archName || null },
      };
      toast('Imported');
    } else {
      throw new Error('Unrecognized JSON — need management_groups[] or root{}');
    }
    save(); render();
    closeModal();
  } catch (e) {
    toast('Import failed: ' + e.message);
  }
};

function importAlzArchDef(doc) {
  const groups = doc.management_groups || [];
  const map = new Map();
  for (const g of groups) {
    map.set(g.id, {
      id: g.id,
      type: TYPE.MG,
      name: g.display_name || g.id,
      archetypes: Array.isArray(g.archetypes) ? [...g.archetypes] : [],
      exists: !!g.exists,
      children: [],
    });
  }
  const root = makeRoot();
  for (const g of groups) {
    const node = map.get(g.id);
    if (g.parent_id == null) {
      root.children.push(node);
    } else {
      const parent = map.get(g.parent_id);
      if (!parent) throw new Error(`Unknown parent_id "${g.parent_id}" for "${g.id}"`);
      parent.children.push(node);
    }
  }
  const topLevel = root.children[0];
  const orgName = topLevel ? topLevel.name : 'Contoso';
  return {
    root,
    pool: [],
    meta: { orgName, archName: doc.name || null },
  };
}
modal.textarea.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (!f) return;
  f.text().then(t => modal.textarea.value = t);
});
modal.textarea.addEventListener('dragover', (e) => e.preventDefault());

// =====================================================================
// Toast
// =====================================================================

const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

// =====================================================================

if (load()) {
  // Restored from localStorage
}
render();
